name: Push Translations to Transifex

on:
  push:
    branches:
      - '3.15'
    paths:
      - '**/*.po'

  workflow_dispatch:

permissions:
  contents: read
  actions: write # FIX: Added write permissions so step 1 can cancel workflows

jobs:
  push-translations:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version:
          - '3.15'

    steps:
      # ------------------------------------------------------------
      # 1. Cancel older workflow runs
      # ------------------------------------------------------------
      - name: Cancel previous workflow runs
        uses: styfle/cancel-workflow-action@0.12.1 # FIX: Pinned to a stable release instead of @main
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # 2. Check out the translation repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4 # FIX: Updated from @master to @v4
        with:
          # FIX: Removed the hardcoded `ref: ${{ matrix.version }}` so workflow_dispatch works on any branch
          fetch-depth: 0

      # ------------------------------------------------------------
      # 3. Set up Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5 # FIX: Updated from @master to @v5
        with:
          python-version: '3'

      # ------------------------------------------------------------
      # 4. Install system and Python dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y gettext

          python -m pip install --upgrade pip

          python -m pip install \
            requests \
            cogapp \
            polib \
            transifex-python \
            sphinx-intl \
            blurb \
            six

      # ------------------------------------------------------------
      # 5. Install Transifex CLI
      # ------------------------------------------------------------
      - name: Install Transifex CLI
        shell: bash
        run: |
          set -euo pipefail

          INSTALL_DIR="$(mktemp -d)"

          echo "Temporary Transifex install directory: $INSTALL_DIR"

          cd "$INSTALL_DIR"

          curl -o- \
            https://raw.githubusercontent.com/transifex/cli/master/install.sh \
            | bash

          echo
          echo "=== INSTALL DIRECTORY CONTENTS ==="
          ls -la

          if [ ! -f "./tx" ]; then
            echo "ERROR: Transifex installer did not create the tx binary."
            exit 1
          fi

          chmod +x ./tx

          sudo install \
            -m 0755 \
            ./tx \
            /usr/local/bin/tx

          echo
          echo "Transifex CLI installed at:"
          command -v tx

      # ------------------------------------------------------------
      # 6. Verify required tools
      # ------------------------------------------------------------
      - name: Verify installed tools
        run: |
          set -euo pipefail

          echo "=== Python ==="
          python --version

          echo
          echo "=== gettext ==="
          msgcat --version | head -n 1

          echo
          echo "=== Transifex CLI path ==="
          command -v tx

          echo
          echo "=== Transifex CLI version ==="
          tx --version

      # ------------------------------------------------------------
      # 7. Generate Transifex configuration
      # ------------------------------------------------------------
      - name: Generate Transifex configuration
        run: |
          set -euo pipefail

          chmod +x .github/workflows/transifex-util.py

          python3 .github/workflows/transifex-util.py \
            recreate_tx_config \
            --language ta \
            --project-slug python-newest \
            --version "${{ matrix.version }}"
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}

      # ------------------------------------------------------------
      # 8. Validate generated .tx/config
      # ------------------------------------------------------------
      - name: Validate Transifex configuration
        run: |
          set -euo pipefail

          if [ ! -f ".tx/config" ]; then
            echo "ERROR: .tx/config was not generated."
            exit 1
          fi

          if [ ! -s ".tx/config" ]; then
            echo "ERROR: .tx/config is empty."
            exit 1
          fi

          RESOURCE_COUNT=$(grep -c '^\[' .tx/config || true)

          echo "Configuration section count: $RESOURCE_COUNT"

          if [ "$RESOURCE_COUNT" -le 1 ]; then
            echo "ERROR: No Transifex resource mappings were generated."
            exit 1
          fi

          echo "Transifex configuration generated successfully."

      # ------------------------------------------------------------
      # 9. Show generated paths
      # ------------------------------------------------------------
      - name: Show generated Transifex paths
        run: |
          set -euo pipefail

          echo "=== FILE FILTERS ==="

          grep '^file_filter' .tx/config | head -n 30 || true

          echo
          echo "=== SOURCE FILES ==="

          grep '^source_file' .tx/config | head -n 30 || true

          echo
          echo "=== LANGUAGE PLACEHOLDER CHECK ==="

          if ! grep -q '<lang>' .tx/config; then
            echo "ERROR: No <lang> placeholder exists in .tx/config."
            exit 1
          fi

          echo "<lang> placeholder found successfully."

      # ------------------------------------------------------------
      # 10. Validate original Tamil PO files
      # ------------------------------------------------------------
      - name: Validate repository translation files
        shell: bash
        run: |
          set -euo pipefail

          echo "=== ORIGINAL TAMIL PO FILES ==="

          ORIGINAL_FILE_COUNT=$(
            find . \
              -type f \
              -name "*.po" \
              ! -path "./locales/*" \
              ! -path "./.git/*" \
              | wc -l
          )

          echo "Original Tamil PO file count: $ORIGINAL_FILE_COUNT"

          if [ "$ORIGINAL_FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No Tamil .po files exist in the repository."
            exit 1
          fi

      # ------------------------------------------------------------
      # 11. Create temporary Transifex-compatible Tamil locale tree
      # ------------------------------------------------------------
      - name: Prepare Tamil translations for Transifex
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating temporary Tamil locale structure..."

          mkdir -p ta/LC_MESSAGES

          MAPPED_COUNT=0

          while IFS= read -r -d '' file; do
            relative_path="${file#./}"

            target="ta/LC_MESSAGES/${relative_path}"

            mkdir -p "$(dirname "$target")"

            cp "$file" "$target"

            echo "Mapped: $relative_path -> $target"

            MAPPED_COUNT=$((MAPPED_COUNT + 1))
          done < <(
            find . \
              -type f \
              -name "*.po" \
              ! -path "./ta/*" \
              ! -path "./.git/*" \
              -print0
          )

          echo
          echo "Total mapped Tamil files: $MAPPED_COUNT"

          if [ "$MAPPED_COUNT" -eq 0 ]; then
            echo "ERROR: No Tamil translation files were mapped."
            exit 1
          fi
          
      # ------------------------------------------------------------
      # 12. Validate temporary Tamil locale structure
      # ------------------------------------------------------------
      - name: Validate Tamil locale mapping
        shell: bash
        run: |
          set -euo pipefail

          MAPPED_FILE_COUNT=$(
            find ta/LC_MESSAGES \
              -type f \
              -name "*.po" \
              | wc -l
          )

          echo "Mapped Tamil PO file count: $MAPPED_FILE_COUNT"

          if [ "$MAPPED_FILE_COUNT" -eq 0 ]; then
            echo "ERROR: ta/LC_MESSAGES contains no PO files."
            exit 1
          fi

          echo
          echo "=== SAMPLE MAPPED FILES ==="

          mapfile -d '' SAMPLE_FILES < <(
            find ta/LC_MESSAGES \
              -type f \
              -name "*.po" \
              -print0
          )

          printf '%s\n' "${SAMPLE_FILES[@]:0:30}"

          echo
          echo "Tamil locale mapping validation completed successfully."

          
      # ------------------------------------------------------------
      # 13. Verify Transifex file_filter mappings
      # ------------------------------------------------------------
      - name: Verify Transifex file mappings
        shell: bash
        run: |
          set -euo pipefail

          echo "=== VERIFYING TRANSIFEX FILE MAPPINGS ==="

          CHECKED=0
          FOUND=0
          MISSING=0

          while IFS= read -r filter; do
            filter="${filter#*=}"
            filter="$(echo "$filter" | xargs)"

            tamil_path="${filter//<lang>/ta}"

            CHECKED=$((CHECKED + 1))

            if [ -f "$tamil_path" ]; then
              FOUND=$((FOUND + 1))
            else
              MISSING=$((MISSING + 1))
              echo "Missing local translation: $tamil_path"
            fi
          done < <(grep '^file_filter' .tx/config)

          echo
          echo "Mappings checked: $CHECKED"
          echo "Tamil files found: $FOUND"
          echo "Tamil files missing: $MISSING"

          if [ "$CHECKED" -eq 0 ]; then
            echo "ERROR: No file_filter entries found in .tx/config."
            exit 1
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: No Transifex file_filter matched a Tamil PO file."
            exit 1
          fi

          echo
          echo "Transifex Tamil file mappings are valid."

      # ------------------------------------------------------------
      # 13.5 Catch broken PO files before uploading
      # ------------------------------------------------------------
      - name: Check PO file syntax
        shell: bash
        run: |
          set -euo pipefail

          echo "Running syntax checks on all Tamil PO files..."
          
          # msgfmt -c checks the file for valid gettext formatting
          # If a file is broken, this step will fail and tell you exactly which line is wrong.
          find ta/LC_MESSAGES -type f -name "*.po" -exec msgfmt -c -o /dev/null {} \;
          
          echo "All PO files passed syntax validation!"

      # ------------------------------------------------------------
      # 14. Push Tamil translations to Transifex
      # ------------------------------------------------------------
      - name: Push Tamil translations to Transifex
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Tamil translation push..."

          # --skip ensures that if one file fails, it keeps pushing the rest
          tx push \
            -t \
            -l ta \
            --force \
            --skip

          echo
          echo "Transifex push command completed successfully."
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
